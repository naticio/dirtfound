<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DirtFound — find off-market deals by owner</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="map"></div>

  <header class="panel filterbar">
    <span class="brand">DirtFound</span>

    <div class="fgroup">
      <button class="fbtn" id="btn-status" type="button">Owner type ▾</button>
      <div class="dropdown hidden" id="dd-status">
        <label><input type="checkbox" data-status="Out-of-state" checked /> Absentee — out-of-state</label>
        <label><input type="checkbox" data-status="Absentee (TX)" checked /> Absentee — in-state</label>
        <label><input type="checkbox" data-status="Local" checked /> Local owner</label>
        <label><input type="checkbox" data-status="Unknown" checked /> Unknown</label>
      </div>
    </div>

    <div class="fgroup">
      <button class="fbtn" id="btn-value" type="button">Value ▾</button>
      <div class="dropdown hidden" id="dd-value">
        <label>Min $ <input type="number" id="val-min" placeholder="0" min="0" step="10000" /></label>
        <label>Max $ <input type="number" id="val-max" placeholder="no limit" min="0" step="10000" /></label>
      </div>
    </div>

    <input class="fsearch" id="owner-search" type="search" placeholder="Owner name…" />

    <label class="fbtn ftoggle" for="violations-toggle">
      <input type="checkbox" id="violations-toggle" /> Violations
    </label>

    <label class="fbtn ftoggle" for="taxsales-toggle">
      <input type="checkbox" id="taxsales-toggle" /> Tax sales
    </label>

    <button class="fbtn primary" id="export-csv" type="button">Export CSV</button>

    <span class="fcount" id="result-count"></span>
  </header>

  <div class="panel legend" id="legend-counties">
    <h2>Share of out-of-state owners</h2>
    <div class="gradient"></div>
    <div class="gradient-labels"><span>0%</span><span>40%+</span></div>
  </div>

  <div class="panel legend hidden" id="legend-parcels">
    <h2>Parcel ownership</h2>
    <ul>
      <li><span class="swatch" style="background:#dc2626"></span>Absentee — out-of-state</li>
      <li><span class="swatch" style="background:#ea580c"></span>Absentee — in-state</li>
      <li><span class="swatch" style="background:#3b5bdb"></span>Local owner</li>
      <li><span class="swatch" style="background:#94a3b8"></span>Unknown</li>
    </ul>
    <div class="legend-violations hidden" id="legend-violations">
      <span class="vdot"></span>Open code violation
    </div>
    <div class="legend-violations hidden" id="legend-taxsales">
      <span class="vdot tdot"></span>Tax foreclosure sale
    </div>
  </div>

  <div class="panel credits">
    Data: <a href="https://tnris.org/stratmap/land-parcels/" target="_blank" rel="noopener">TxGIO 2025 Statewide Land Parcels</a>
    · Workflow by <a href="https://walker-data.com/posts/millions-of-parcels" target="_blank" rel="noopener">Kyle Walker</a>
    · Basemap © <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> / OpenStreetMap
  </div>

  <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@4.4.0/dist/pmtiles.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
