name = "texas-parcel-map"
main = "worker/index.js"
compatibility_date = "2026-08-01"

# Custom domain (registered via Cloudflare Registrar on this account)
routes = [
  { pattern = "dirtfound.com", custom_domain = true },
  { pattern = "www.dirtfound.com", custom_domain = true },
]

# Static frontend (vanilla JS, no build step)
[assets]
directory = "./public"
binding = "ASSETS"

# R2 bucket holding the PMTiles archive(s), served at /tiles/<file>.
# Create it with:  npx wrangler r2 bucket create parcel-data
[[r2_buckets]]
binding = "TILES"
bucket_name = "parcel-data"

# Owner search index (all parcels, FTS5 on owner names), served at /api/search
[[d1_databases]]
binding = "OWNERS"
database_name = "dirtfound-owners"
database_id = "d56d9f2b-15ab-47a1-a1c2-a30c008b30d5"

# One-time email magic-link login tokens (short TTL) — lets a Pro subscriber
# restore access on a new browser/device. Secret to set: RESEND_API_KEY
# (resend.com, free tier). "from" domain must be verified in Resend first.
[[kv_namespaces]]
binding = "LOGIN_TOKENS"
id = "b419b6919a7a4f1f98a23e893398e40e"
